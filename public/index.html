<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>swiswi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4;--card:#ffffff;--text:#0f172a;--mute:#64748b;--line:#e5e9ee;--soft:#f6f8fa;
  --brand:#0f766e;--brand2:#14b8a6;--brandtext:#ffffff;
  --mine:#0f766e;--minetext:#ffffff;--theirs:#ffffff;--theirstext:#0f172a;
  --chatbg:#f1f5f4;--danger:#dc2626;--dangerbg:#fef2f2;--shadow:0 10px 40px rgba(15,23,42,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0e11;--card:#141a1f;--text:#e8edf2;--mute:#8b98a6;--line:#232c34;--soft:#1a2128;
  --brand:#14b8a6;--brand2:#2dd4bf;--brandtext:#04201c;
  --mine:#0f766e;--minetext:#ffffff;--theirs:#1d252c;--theirstext:#e8edf2;
  --chatbg:#0f1418;--dangerbg:#2a1517;--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:440px;height:100dvh;max-height:820px;background:var(--card);display:flex;flex-direction:column;position:relative;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:520px){#app{height:min(100dvh - 48px,820px);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);padding:0}}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;background:var(--brand);color:var(--brandtext);font-weight:600;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.btn.full{width:100%}
.btn.danger{background:var(--danger);color:#fff}
.field{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);font:inherit;font-size:16px;outline:none;transition:border-color .15s,background .15s}
.field:focus{border-color:var(--brand);background:var(--card)}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:8px 2px 0}

/* name screen */
.hero{margin:auto;width:100%;padding:32px 28px;text-align:center}
.logo{width:68px;height:68px;border-radius:20px;margin:0 auto 20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 24px rgba(20,184,166,.35)}
.logo svg{width:32px;height:32px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--mute);line-height:1.5;margin:0 0 24px;font-size:14.5px}
.hero .field{text-align:center}
.hero .btn{margin-top:12px}
.conn{color:var(--mute);font-size:12px;margin-top:14px;min-height:16px}

/* avatars + names */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none;transition:filter .9s,opacity .9s}
.av.sm{width:34px;height:34px;font-size:14px}
.nm{position:relative;font-weight:600;transition:filter .9s,opacity .9s,letter-spacing .9s}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-left:7px;vertical-align:middle;box-shadow:0 0 0 3px rgba(34,197,94,.22)}

/* top bars */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who small{color:var(--mute);font-size:12px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text);transition:background .15s}
.iconbtn:hover{background:var(--soft)}

/* search screen */
.body{padding:24px 20px;flex:1;overflow-y:auto}
.body h2{font-size:20px;letter-spacing:-.01em;margin:0 0 4px}
.searchrow{display:flex;gap:8px;margin-top:16px}
.searchrow .field{flex:1}
.result{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--soft);animation:in .25s ease}
.result .nm{flex:1;font-size:16px}
.nf{margin-top:16px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--mute)}
.nf b{display:block;color:var(--text);font-size:16px;margin-bottom:12px}
.sect{margin:28px 2px 10px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px;transition:background .15s}
.crow:hover{background:var(--soft)}

/* chat */
.tabs{display:none;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.tab.sel{background:var(--brand);color:var(--brandtext);border-color:var(--brand)}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px;background:var(--chatbg)}
.sys{align-self:center;color:var(--mute);font-size:12px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;margin-bottom:6px;text-align:center}
.m{max-width:78%;padding:9px 13px 7px;border-radius:18px;line-height:1.4;overflow-wrap:anywhere;transition:opacity .6s,transform .6s,filter .6s;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.m.me{align-self:flex-end;background:var(--mine);color:var(--minetext);border-bottom-right-radius:5px}
.m.them{align-self:flex-start;background:var(--theirs);color:var(--theirstext);border-bottom-left-radius:5px}
.m .t{display:block;font-size:10.5px;opacity:.65;text-align:right;margin-top:2px}
.m.gone{opacity:0;transform:scale(.92);filter:blur(4px)}
.bar{height:2px;border-radius:2px;background:currentColor;opacity:.35;margin-top:5px;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.compose{border-top:1px solid var(--line);padding:8px 12px 12px;background:var(--card)}
.opts{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mute);padding:0 2px 8px}
select{background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px}
.row{display:flex;gap:6px;align-items:center}
.row .field{padding:11px 16px;border-radius:999px}
.send{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brandtext);display:grid;place-items:center;flex:none;transition:transform .1s}
.send:active{transform:scale(.93)}
.panel{display:none;max-height:156px;overflow-y:auto;padding:6px 0;flex-wrap:wrap;gap:2px}
.panel.on{display:flex}
.panel button{padding:4px;font-size:26px;border-radius:10px}
.panel button:hover{background:var(--soft)}

/* photos */
.panel.pho.on{display:block}
.pick{display:flex;gap:8px;padding:6px 0}.pick .btn{flex:1}
.prev{flex-direction:column;gap:10px;padding:6px 0}
.prev img{max-height:150px;max-width:100%;border-radius:12px;align-self:center;object-fit:contain}
.pacts{display:flex;gap:8px}.pacts .btn{flex:1}
.m.ph{padding:5px 5px 6px}
.m.ph .pic{display:block;max-width:100%;max-height:260px;border-radius:14px;cursor:zoom-in}
.m.ph .t{padding:0 8px}.m.ph .bar{margin:5px 8px 0}
#lb{position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:40;padding:16px;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:12px}

/* dissolve button + animation */
.dissolve{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--dangerbg);color:var(--danger);font-size:13px;font-weight:600;transition:filter .15s}
.dissolve:hover{filter:brightness(.96)}
#s-chat.vanish #msgs>*,#s-chat.vanish .av,#s-chat.vanish .nm,#s-chat.vanish .who small,#s-chat.vanish .tabs{opacity:0;filter:blur(10px);transition:opacity .9s,filter .9s,transform .9s;transform:translateY(-8px) scale(.96)}
#s-chat.vanish .nm{letter-spacing:.35em}

/* modal + toast */
.scrim{position:absolute;inset:0;background:rgba(2,6,23,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:20;backdrop-filter:blur(3px)}
.scrim.on{display:flex;animation:in .2s ease}
.modal{background:var(--card);border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow)}
.modal .big{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:var(--dangerbg);color:var(--danger)}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 20px;color:var(--mute);font-size:14px;line-height:1.5}
.modal .acts{display:flex;gap:8px}.modal .acts .btn{flex:1}
#toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--text);color:var(--card);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s;z-index:30;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">

<!-- NAME -->
<section class="screen on" id="s-name"><div class="hero">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.2A8 8 0 1 1 21 12z"/></svg></div>
  <h1>Find the Best Sound</h1>
  
  <input class="field" id="nameIn" maxlength="20" placeholder="Enter your name" autocomplete="off">
  <div class="err" id="nameErr"></div>
  <button class="btn full" id="saveName">Continue</button>
  <div class="conn" id="conn">Connecting…</div>
</div></section>

<!-- SEARCH -->
<section class="screen" id="s-search">
  <div class="topbar">
    <div class="av sm" id="meAv"></div>
    <div class="who"><b id="meName"></b><small>Online</small></div>
    <button class="iconbtn" id="chgName" aria-label="Change name"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </div>
  <div class="body">
    <h2>Artist</h2>
    
    <div class="searchrow">
      <input class="field" id="qIn" maxlength="20" placeholder="Search their name" autocomplete="off">
      <button class="btn" id="searchBtn">Search</button>
    </div>
    <div id="out"></div>
    <div id="chatsWrap" style="display:none"><div class="sect">Active chats</div><div id="chatList"></div></div>
  </div>
</section>

<!-- CHAT -->
<section class="screen" id="s-chat">
  <div class="topbar">
    <button class="iconbtn" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="av" id="hAv"></div>
    <div class="who"><span id="hdr"></span><small id="hStat"></small></div>
    <button class="dissolve" id="dissolveBtn" title="Dissolve this chat"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>Dissolve</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="msgs"></div>
  <div class="compose">
    <div class="panel" id="emo"></div>
    <div class="panel pho" id="pho">
      <div id="pickBtns" class="pick">
        <button class="btn ghost" id="pGal">Gallery</button>
        <button class="btn " id="pCam">Camera</button>
      </div>
      <div id="prevBox" class="prev" style="display:none">
        <img id="prevImg" alt="">
        <div class="pacts"><button class="btn ghost" id="pCancel">Cancel</button><button class="btn" id="pSend">Send photo</button></div>
      </div>
    </div>
    <input type="file" id="fGal" accept="image/*" hidden>
    <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
    <div class="opts"><span>Text vanish timer</span>
      <select id="ttl"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option><option value="900" selected>900 seconds</option><option value="3600" selected>3600 seconds</option></select>
    </div>
    <div class="row">
      <button class="iconbtn" id="bEmo" aria-label="Emojis"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></button>
      <button class="iconbtn" id="bPho" aria-label="Photos"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <input class="field" id="txt" placeholder="Type a message" autocomplete="off" maxlength="500">
      <button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>
</section>

<div id="lb"><img id="lbImg" alt=""></div>
<div id="toast"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, get, push, remove, onValue, onChildAdded, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ============================================================
   STEP 1: PASTE YOUR FIREBASE CONFIG HERE (from Firebase console)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBegSJ5mItb7XDNJUMwH9K8Sz6TGs6UABg",
  authDomain: "swisw1.firebaseapp.com",
  databaseURL: "https://swisw1-default-rtdb.firebaseio.com",
  projectId: "swisw1",
  storageBucket: "swisw1.firebasestorage.app",
  messagingSenderId: "1035376751340",
  appId: "1:1035376751340:web:a11985f435de5a41886bc9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const EMOJIS = "😀 😃 😄 😁 😆 😅 😂 🤣 😊 ❤️ 🧡 💛 💚 💙 💜 🖤 💔 😇 🙂 😉 😍 🥰 😘 😋 😛 😜 🤪 😎 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 😣 😢 😭 😤 😠 😡 🤯 😳 🥺 😱 😨 😰 😓 🤗 🤔 🤭 🤫 🙄 😬 😴 🤤 😷 🤒 🤢 🥵 🥶 👍 👎 👏 🙌 🙏 💪 👋 🤝 ✌️ 🤞 👌 🔥 ✨ 💯 🎉 🎂 🎁 ☕ 🍕 🍔 🍟 🍺 ⚽ 🎵 🌹 🌞 🌙 ⭐ 🐶 🐱 🐵 🦁".split(" ");

const $ = id => document.getElementById(id);
let uid = null, myName = "", myKey = "", TTL = 10, current = null, inboxStarted = false, pendingDissolve = null;
const convs = {};   // peerUid -> { name, key, online, els[], unsub }

/* ---------- helpers ---------- */
const keyOf = n => encodeURIComponent(n.trim().toLowerCase()).replace(/\./g, "%2E");
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const show = id => { document.querySelectorAll(".screen").forEach(s => s.classList.remove("on")); $(id).classList.add("on"); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
function hue(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function avatar(el, name) { el.textContent = (name || "?").trim().charAt(0).toUpperCase(); el.style.background = `linear-gradient(135deg,hsl(${hue(name)} 60% 45%),hsl(${(hue(name) + 40) % 360} 65% 52%))`; }
function nameEl(name, online) {
  const s = document.createElement("span"); s.className = "nm";
  if (!name) return s;
  s.appendChild(document.createTextNode(name));
  if (online) { const d = document.createElement("i"); d.className = "dot"; s.appendChild(d); }
  return s;
}

/* ---------- anonymous sign-in ---------- */
const ready = new Promise(res => { onAuthStateChanged(auth, u => { if (u) { uid = u.uid; $("conn").textContent = ""; res(); } }); });
signInAnonymously(auth).catch(e => { $("conn").textContent = "Could not connect: " + e.code; });

/* ---------- claim name + presence ---------- */
async function claimName(n) {
  await ready;
  const key = keyOf(n), r = ref(db, "names/" + key);
  const res = await runTransaction(r, cur => (cur === null || cur.uid === uid) ? { uid, name: n } : undefined);
  if (!res.committed) return false;
  if (myKey && myKey !== key) remove(ref(db, "names/" + myKey));
  myKey = key; myName = n;
  onDisconnect(r).remove();
  return true;
}
onValue(ref(db, ".info/connected"), snap => {
  if (snap.val() === true && myKey && uid) {
    const r = ref(db, "names/" + myKey);
    onDisconnect(r).remove(); set(r, { uid, name: myName }).catch(() => {});
  }
});
async function saveName() {
  const n = $("nameIn").value.trim();
  if (!n) { $("nameErr").textContent = "Please enter a name."; return; }
  $("nameErr").textContent = "";
  try { if (!(await claimName(n))) { $("nameErr").textContent = "That name is taken right now. Try another."; return; } }
  catch (e) { $("nameErr").textContent = "Connection problem. Please try again."; return; }
  store("vc_name", n);
  $("meName").textContent = n; avatar($("meAv"), n);
  startInbox(); show("s-search"); renderLists();
}
$("saveName").onclick = saveName;
$("nameIn").onkeydown = e => { if (e.key === "Enter") saveName(); };
$("chgName").onclick = () => { $("nameIn").value = myName; show("s-name"); };

/* ---------- search ---------- */
async function search() {
  const q = $("qIn").value.trim(), out = $("out"); out.textContent = "";
  if (!q) return;
  let hit = null;
  try { const snap = await get(ref(db, "names/" + keyOf(q))); if (snap.exists() && snap.val().uid !== uid) hit = snap.val(); } catch (e) {}
  if (hit) {
    const r = document.createElement("div"); r.className = "result";
    const a = document.createElement("div"); a.className = "av"; avatar(a, hit.name);
    r.append(a, nameEl(hit.name, true));
    const b = document.createElement("button"); b.className = "btn"; b.textContent = "Chat";
    b.onclick = () => openChat(hit.uid, hit.name);
    r.appendChild(b); out.appendChild(r);
  } else {
    const d = document.createElement("div"); d.className = "nf";
    const t = document.createElement("b"); t.textContent = "User not found"; d.appendChild(t);
    const b2 = document.createElement("button"); b2.className = "btn ghost"; b2.textContent = "Search again";
    b2.onclick = () => { $("qIn").value = ""; out.textContent = ""; $("qIn").focus(); };
    d.appendChild(b2); out.appendChild(d);
  }
}
$("searchBtn").onclick = search;
$("qIn").onkeydown = e => { if (e.key === "Enter") search(); };

/* ---------- conversations ---------- */
function ensureConv(peerUid, name) {
  if (convs[peerUid]) return convs[peerUid];
  const c = convs[peerUid] = { name, key: keyOf(name), online: true, els: [] };
  c.unsub = onValue(ref(db, "names/" + c.key), snap => {
    c.online = snap.exists() && snap.val().uid === peerUid;
    if (current === peerUid && $("s-chat").classList.contains("on")) renderHeader();
    renderLists();
  });
  return c;
}
function openChat(peerUid, name) { ensureConv(peerUid, name); current = peerUid; show("s-chat"); renderChat(); }
function renderLists() {
  const ids = Object.keys(convs);
  // active chats on the search screen
  $("chatsWrap").style.display = ids.length ? "block" : "none";
  const list = $("chatList"); list.textContent = "";
  ids.forEach(pid => {
    const b = document.createElement("button"); b.className = "crow";
    const a = document.createElement("div"); a.className = "av"; avatar(a, convs[pid].name);
    b.append(a, nameEl(convs[pid].name, convs[pid].online));
    b.onclick = () => openChat(pid, convs[pid].name);
    list.appendChild(b);
  });
  // tabs inside the chat (only when more than one chat is open)
  const tabs = $("tabs"); tabs.textContent = "";
  ids.forEach(pid => {
    const b = document.createElement("button"); b.className = "tab" + (pid === current ? " sel" : "");
    b.textContent = convs[pid].name; b.onclick = () => openChat(pid, convs[pid].name);
    tabs.appendChild(b);
  });
  tabs.style.display = ids.length > 1 ? "flex" : "none";
}
function renderHeader() {
  const c = convs[current]; if (!c) return;
  $("hdr").textContent = ""; $("hdr").appendChild(nameEl(c.name, c.online));
  avatar($("hAv"), c.name);
  $("hStat").textContent = c.online ? "Online" : "Offline";
}
function renderChat() {
  const c = convs[current]; if (!c) return;
  renderHeader(); renderLists();
  const box = $("msgs"); box.textContent = "";
  const s = document.createElement("div"); s.className = "sys";
  s.textContent = "Messages vanish on your side after the time you choose."; box.appendChild(s);
  c.els.forEach(e => box.appendChild(e));
  box.scrollTop = box.scrollHeight;
}
function addMsg(peerUid, mine, type, value) {
  const c = convs[peerUid]; if (!c) return;
  const el = document.createElement("div");
  el.className = "m " + (mine ? "me" : "them") + (type === "photo" ? " ph" : "");
  if (type === "photo") { const im = document.createElement("img"); im.src = value; im.className = "pic"; im.alt = "Photo"; im.onclick = () => openLightbox(value); el.appendChild(im); }
  else el.appendChild(document.createTextNode(value));
  const tm = document.createElement("span"); tm.className = "t";
  tm.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); el.appendChild(tm);
  if (type !== "sticker") { const bar = document.createElement("div"); bar.className = "bar"; bar.style.animationDuration = TTL + "s"; el.appendChild(bar); }
  c.els.push(el);
  if (current === peerUid && $("s-chat").classList.contains("on")) { $("msgs").appendChild(el); $("msgs").scrollTop = $("msgs").scrollHeight; }
  setTimeout(() => { el.classList.add("gone"); setTimeout(() => { el.remove(); c.els = c.els.filter(x => x !== el); }, 650); }, TTL * 1000);
}

/* ---------- sending ---------- */
async function sendMsg(type, value) {
  const c = convs[current]; if (!c || !value) return;
  if (!c.online) { toast(c.name + " is offline"); return; }
  try { await push(ref(db, "inbox/" + current), { from: uid, fromName: myName, type, v: value, ts: Date.now() }); addMsg(current, true, type, value); } catch (e) { toast("Couldn’t send. Please try again."); }
}
$("send").onclick = () => { const v = $("txt").value.trim(); if (v) { sendMsg("text", v); $("txt").value = ""; } };
$("txt").onkeydown = e => { if (e.key === "Enter") $("send").onclick(); };
$("ttl").onchange = () => { TTL = parseInt($("ttl").value, 10); store("vc_ttl", String(TTL)); };
$("back").onclick = () => { show("s-search"); renderLists(); };

/* ---------- DISSOLVE CHAT ---------- */
/* where to send the person one second after they press Dissolve */
const DISSOLVE_REDIRECT_URL = "https://youtu.be/AJVJo-BME7Q?si=_wFU5N8QgBIQFJ5i";

async function dissolveChat(peerUid, notifyPeer, message, redirect) {
  const c = convs[peerUid]; if (!c) return;
  if (notifyPeer && c.online) {
    try { await push(ref(db, "inbox/" + peerUid), { from: uid, fromName: myName, type: "dissolve", v: "x", ts: Date.now() }); } catch (e) {}
  }
  const visible = current === peerUid && $("s-chat").classList.contains("on");
  if (visible) { $("s-chat").classList.add("vanish"); await sleep(950); }
  if (c.unsub) c.unsub();
  delete convs[peerUid];
  if (current === peerUid) current = null;
  $("s-chat").classList.remove("vanish");
  $("msgs").textContent = ""; $("hdr").textContent = ""; $("hAv").textContent = "";
  if (visible) show("s-search");
  // wipe every trace of the person: search result, search box, panels, photo preview, lightbox
  $("out").textContent = ""; $("qIn").value = ""; $("txt").value = ""; $("hStat").textContent = "";
  $("emo").classList.remove("on"); $("pho").classList.remove("on"); $("lb").classList.remove("on"); resetPhoto();
  renderLists();
  toast(message);
  if (redirect) setTimeout(() => { location.replace(DISSOLVE_REDIRECT_URL); }, 1000);
}
$("dissolveBtn").onclick = () => { if (current) dissolveChat(current, true, "Chat dissolved", true); };

/* ---------- receiving ---------- */
function startInbox() {
  if (inboxStarted) return; inboxStarted = true;
  onChildAdded(ref(db, "inbox/" + uid), snap => {
    const d = snap.val();
    remove(snap.ref).catch(() => {});
    if (!d || typeof d.fromName !== "string" || typeof d.v !== "string") return;
    if (Date.now() - d.ts > 5 * 60 * 1000) return;
    if (d.type === "dissolve") {
      if (convs[d.from]) dissolveChat(d.from, false, "Chat dissolved");
      return;
    }
    if (d.type === "photo") { if (!d.v.startsWith("data:image/jpeg;base64,") || d.v.length > 200000) return; }
    else if (d.type !== "text") return;
    ensureConv(d.from, d.fromName);
    addMsg(d.from, false, d.type, d.type === "photo" ? d.v : d.v.slice(0, 500));
    renderLists();
  });
}

/* ---------- emoji and sticker panels ---------- */
function fill(id, list) {
  list.forEach(e => {
    const b = document.createElement("button"); b.textContent = e;
    b.onclick = () => { const i = $("txt"); i.value += e; i.focus(); };
    $(id).appendChild(b);
  });
}
fill("emo", EMOJIS);
function openPanel(id) {
  ["emo", "pho"].forEach(p => { if (p !== id) $(p).classList.remove("on"); });
  $(id).classList.toggle("on");
  if (id !== "pho" || !$("pho").classList.contains("on")) resetPhoto();
}
$("bEmo").onclick = () => openPanel("emo");
$("bPho").onclick = () => openPanel("pho");

/* ---------- photos (resized in the browser, sent through the database, no Storage needed) ---------- */
let pendingPhoto = null;
const MAXLEN = 190000;   // about 140 KB of image
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let max = 900, q = 0.7;
      for (let i = 0; i < 6; i++) {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const out = c.toDataURL("image/jpeg", q);
        if (out.length <= MAXLEN) return resolve(out);
        max = Math.round(max * 0.8); q = Math.max(0.4, q - 0.08);
      }
      reject(new Error("too big"));
    };
    img.onerror = () => reject(new Error("bad image"));
    img.src = url;
  });
}
function resetPhoto() {
  pendingPhoto = null; $("prevImg").removeAttribute("src");
  $("prevBox").style.display = "none"; $("pickBtns").style.display = "flex";
  $("fGal").value = ""; $("fCam").value = "";
}
async function pickPhoto(file) {
  if (!file || !file.type.startsWith("image/")) return;
  try {
    pendingPhoto = await compress(file);
    $("prevImg").src = pendingPhoto; $("prevBox").style.display = "flex"; $("pickBtns").style.display = "none";
  } catch (e) { toast("Couldn’t use that photo"); resetPhoto(); }
}
$("pGal").onclick = () => $("fGal").click();
$("pCam").onclick = () => $("fCam").click();
$("fGal").onchange = e => pickPhoto(e.target.files[0]);
$("fCam").onchange = e => pickPhoto(e.target.files[0]);
$("pCancel").onclick = resetPhoto;
$("pSend").onclick = async () => { if (!pendingPhoto) return; const p = pendingPhoto; resetPhoto(); $("pho").classList.remove("on"); await sendMsg("photo", p); };
function openLightbox(src) { $("lbImg").src = src; $("lb").classList.add("on"); }
$("lb").onclick = () => { $("lb").classList.remove("on"); $("lbImg").removeAttribute("src"); };

/* ---------- start ---------- */
const st = parseInt(store("vc_ttl") || "10", 10);
if ([5, 10, 30, 60].includes(st)) { TTL = st; $("ttl").value = String(st); }
const saved = store("vc_name"); if (saved) $("nameIn").value = saved;
</script>
